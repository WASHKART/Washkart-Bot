<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Washkart Counter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827;}

.login-screen{display:none;flex-direction:column;align-items:center;justify-content:center;height:100vh;height:100dvh;gap:24px;padding:2rem;background:#16a34a;}
.login-logo{font-size:64px;}
.login-input{width:100%;max-width:260px;padding:18px;border:none;border-radius:14px;font-size:24px;text-align:center;letter-spacing:4px;}
.login-btn{width:100%;max-width:260px;padding:18px;background:#111827;color:#fff;border:none;border-radius:14px;font-size:32px;cursor:pointer;}
.login-error{font-size:40px;}

.app{display:none;height:100vh;height:100dvh;flex-direction:column;}
.tabs{display:flex;background:#111827;flex-shrink:0;padding-top:env(safe-area-inset-top);}
.tab{flex:1;padding:16px 8px;text-align:center;font-size:15px;font-weight:700;background:none;border:none;color:#6b7280;position:relative;}
.tab.active{color:#fff;}
.tab.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:4px;background:#4ade80;border-radius:2px;}
.tab-count{display:inline-flex;align-items:center;justify-content:center;background:#dc2626;color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;padding:0 5px;margin-left:4px;}

.list{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:1rem;-webkit-overflow-scrolling:touch;}
.empty{text-align:center;padding:4rem 1rem;color:#9ca3af;font-size:60px;}

.card{background:#fff;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.08);overflow:hidden;flex-shrink:0;}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#f9fafb;border-bottom:1px solid #f0f0f0;}
.order-id{font-family:monospace;font-size:11px;color:#9ca3af;}
.card-body{padding:16px;}
.cust-name{font-size:19px;font-weight:700;}
.address-text{font-size:14px;color:#6b7280;margin-top:2px;}
.items-summary{font-size:14px;color:#374151;margin-top:8px;background:#f9fafb;padding:8px 10px;border-radius:8px;}
.notes-text{font-size:14px;color:#92400e;background:#fffbeb;padding:10px 12px;border-radius:10px;margin-top:10px;line-height:1.4;}
.print-btn-inline{margin-top:10px;padding:10px 0;width:100%;border-radius:10px;border:2px solid #e5e7eb;background:#f9fafb;font-size:14px;font-weight:700;color:#374151;}

.card-actions{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px;}
.act-btn{width:100%;padding:16px 0;border:none;border-radius:16px;font-size:18px;font-weight:800;cursor:pointer;background:#16a34a;color:#fff;}
.act-btn-secondary{background:none;border:2px dashed #fecaca;color:#dc2626;font-size:13px;padding:10px 0;}
.flagged-banner{margin:0 16px 16px;padding:16px 0;background:#fef2f2;color:#dc2626;text-align:center;font-size:22px;border-radius:16px;border:2px dashed #fecaca;}

.bottom-bar{display:flex;gap:10px;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e5e7eb;flex-shrink:0;}
.bottom-btn{flex:1;padding:18px 0;border-radius:14px;font-size:22px;font-weight:800;border:none;text-align:center;text-decoration:none;color:#fff;}
.bottom-btn-add{background:#16a34a;}
.bottom-btn-call{background:#dc2626;}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:1.5rem;}
.overlay.show{display:flex;}
.confirm-box{background:#fff;border-radius:24px;padding:1.8rem 1.5rem;width:100%;max-width:360px;text-align:center;max-height:88vh;overflow-y:auto;}
.confirm-icon{font-size:50px;margin-bottom:.6rem;}
.confirm-actions{display:flex;gap:12px;}
.confirm-btn{flex:1;padding:20px 0;border:none;border-radius:16px;font-size:20px;font-weight:800;}
.confirm-yes{background:#16a34a;color:#fff;}
.confirm-cancel{background:#f3f4f6;color:#374151;}
.act-no{background:#fef2f2;color:#dc2626;}
.confirm-back-link{display:block;width:100%;margin-top:14px;padding:10px 0;background:none;border:none;color:#6b7280;font-size:14px;font-weight:600;text-decoration:underline;}

.section-label{font-size:11px;font-weight:800;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px;text-align:left;}
.name-input{width:100%;padding:16px;border:2px solid #e5e7eb;border-radius:14px;font-size:20px;text-align:center;margin-bottom:10px;}
.phone-input{width:100%;padding:16px;border:2px solid #e5e7eb;border-radius:14px;font-size:24px;text-align:center;letter-spacing:2px;}
.toggle-row{display:flex;gap:8px;}
.toggle-btn{flex:1;padding:14px 4px;border:2px solid #e5e7eb;border-radius:12px;background:#f9fafb;font-size:14px;font-weight:700;color:#374151;}
.toggle-btn.active{background:#dcfce7;border-color:#16a34a;color:#15803d;}

.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px;}
.svc-btn{padding:14px 0;border:2px solid #e5e7eb;border-radius:16px;background:#f9fafb;display:flex;flex-direction:column;align-items:center;gap:4px;}
.svc-btn.selected{background:#dcfce7;border-color:#16a34a;}
.svc-emoji{font-size:30px;}
.svc-label{font-size:12px;font-weight:600;color:#374151;}

.catalog-tabs{display:flex;gap:8px;justify-content:center;margin:10px 0;}
.catalog-tab{width:44px;height:44px;border-radius:12px;border:2px solid #e5e7eb;background:#f9fafb;font-size:22px;}
.catalog-tab.active{background:#dcfce7;border-color:#16a34a;}
.catalog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:220px;overflow-y:auto;margin-bottom:8px;}
.catalog-item{position:relative;padding:12px 4px;border:2px solid #e5e7eb;border-radius:14px;background:#f9fafb;display:flex;flex-direction:column;align-items:center;gap:2px;}
.catalog-item:active{background:#dcfce7;border-color:#16a34a;}
.catalog-icon{font-size:26px;}
.catalog-name{font-size:10px;font-weight:700;color:#374151;}
.tally-qty-badge{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:#16a34a;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.item-count-note{font-size:12px;color:#6b7280;margin-top:4px;}

.photo-preview{width:100%;border-radius:14px;margin-bottom:12px;max-height:180px;object-fit:cover;}
.pay-method-grid{display:flex;flex-direction:column;gap:10px;}
.pay-method-btn{padding:18px 0;border:2px solid #e5e7eb;border-radius:16px;font-size:19px;font-weight:800;background:#f9fafb;}
.pay-method-btn.cash{color:#16a34a;}
.pay-method-btn.upi{color:#2563eb;}

.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(17,24,39,.95);color:#fff;padding:26px 36px;border-radius:20px;font-size:44px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:200;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div class="login-screen" id="login-screen">
  <div class="login-logo">🏪</div>
  <input class="login-input" id="login-pass" type="password" inputmode="numeric" placeholder="••••" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="login-btn" onclick="doLogin()">➡️</button>
  <div class="login-error" id="login-error"></div>
</div>

<div class="app" id="app">
  <div class="tabs">
    <button class="tab active" id="tab-processing" onclick="switchTab('processing')">🫧 PROCESSING<span class="tab-count" id="count-processing" style="display:none">0</span></button>
    <button class="tab" id="tab-ready" onclick="switchTab('ready')">✅ READY<span class="tab-count" id="count-ready" style="display:none">0</span></button>
  </div>
  <div class="list" id="list"></div>
  <div class="bottom-bar">
    <button class="bottom-btn bottom-btn-add" onclick="openNewOrder()">➕ NEW</button>
    <a class="bottom-btn bottom-btn-call" href="tel:+919552552167">📞 CALL</a>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="confirm-box" id="confirm-content"></div>
</div>

<input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoSelected(event)">

<div class="toast" id="toast"></div>

<script>
const BOT_URL = 'https://washkart-bot.onrender.com';
let staffKey = sessionStorage.getItem('wk_staff_key') || '';
let activeTab = 'processing';
let allPickups = [];
let takenOrderId = null;
let takenPaidMethod = null;

const RAW_ITEM_PRICES = {
  shirt:{dryclean:100,iron:20,laundry:80},pant:{dryclean:100,iron:20,laundry:80},
  trouser:{dryclean:100,iron:20,laundry:80},jeans:{dryclean:100,iron:20,laundry:80},
  tshirt:{dryclean:100,iron:20,laundry:80},top:{dryclean:100,iron:20,laundry:80},
  kurta:{dryclean:100,iron:30,laundry:80},kurti:{dryclean:100,iron:30,laundry:80},
  blouse:{dryclean:100,iron:20},salwar:{dryclean:100,iron:20},
  saree:{dryclean:350,iron:120},lehenga:{dryclean:350,iron:120},
  blazer:{dryclean:300,iron:120},jacket:{dryclean:250,iron:60},
  overcoat:{dryclean:400,iron:60},sweater:{dryclean:200,iron:40},
  dupatta:{dryclean:120,iron:50},shawl:{dryclean:120,iron:50},
  anarkali:{dryclean:200,iron:50},suit:{dryclean:400,iron:100},
  dress:{dryclean:350,iron:60},gown:{dryclean:350,iron:120},
  sherwani:{dryclean:400,iron:120},towel:{dryclean:150},
  sneaker:{shoes:350},shoe:{shoes:350},canvas:{shoes:300},
  bedsheet:{laundry:150,iron:60},blanket:{laundry:350},curtain:{dryclean:15},
  bag:{specialty:200},helmet:{specialty:150},carpet:{specialty:40},toy:{specialty:200},
};
const ITEM_ICONS = {
  shirt:'👔',pant:'👖',trouser:'👖',jeans:'👖',tshirt:'👕',top:'👚',kurta:'👘',kurti:'👘',
  blouse:'👚',salwar:'👗',saree:'🥻',lehenga:'👗',blazer:'🧥',jacket:'🧥',overcoat:'🧥',
  sweater:'🧶',dupatta:'🧣',shawl:'🧣',anarkali:'👗',suit:'🤵',dress:'👗',gown:'👗',
  sherwani:'🥻',towel:'🧻',sneaker:'👟',shoe:'👞',canvas:'👟',bedsheet:'🛏️',blanket:'🛌',
  curtain:'🪟',bag:'👜',helmet:'🪖',carpet:'🧹',toy:'🧸',
};
// Everyday basics that cost the same regardless of exact type — combined into one
// "Clothes" entry so staff isn't tapping through Shirt/Pant/Trouser/Jeans/T-shirt/Top
// separately. Distinctive/ethnic/formal garments (kurta, saree, blazer, etc.) stay
// individually listed since their prices genuinely differ.
const BASIC_CLOTHES = ['shirt','pant','trouser','jeans','tshirt','top'];
const ITEM_CATALOG = {};
Object.entries(RAW_ITEM_PRICES).forEach(([item, prices]) => {
  if (BASIC_CLOTHES.includes(item)) return; // handled as one combined entry below
  Object.entries(prices).forEach(([svc, price]) => {
    if (!ITEM_CATALOG[svc]) ITEM_CATALOG[svc] = [];
    ITEM_CATALOG[svc].push({ name: item.charAt(0).toUpperCase()+item.slice(1), price, icon: ITEM_ICONS[item] || '🧺' });
  });
});
// One "Clothes" entry per service, using the shared basics price for that service
const basicSvcSet = new Set();
BASIC_CLOTHES.forEach(item => Object.keys(RAW_ITEM_PRICES[item] || {}).forEach(svc => basicSvcSet.add(svc)));
basicSvcSet.forEach(svc => {
  const price = RAW_ITEM_PRICES['shirt']?.[svc];
  if (price !== undefined) {
    if (!ITEM_CATALOG[svc]) ITEM_CATALOG[svc] = [];
    ITEM_CATALOG[svc].unshift({ name: 'Clothes', price, icon: '👕' });
  }
});
const SVC_LIST = [
  {key:'dryclean', icon:'👔', label:'Dry Clean'}, {key:'iron', icon:'🔥', label:'Iron'},
  {key:'laundry', icon:'🧺', label:'Laundry'}, {key:'shoes', icon:'👟', label:'Shoes'},
  {key:'specialty', icon:'✨', label:'Special'},
];
let activeTallyTab = 'dryclean';

function showToast(icon) {
  const el = document.getElementById('toast');
  el.textContent = icon;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1200);
}

async function doLogin() {
  const pass = document.getElementById('login-pass').value.trim();
  if (!pass) return;
  const res = await fetch(`${BOT_URL}/pickups?key=${encodeURIComponent(pass)}`);
  if (res.status === 401) { document.getElementById('login-error').textContent = '❌'; return; }
  staffKey = pass;
  sessionStorage.setItem('wk_staff_key', pass);
  showApp();
}
function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  loadData();
  setInterval(loadData, 20000);
}
function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tab-processing').className = 'tab' + (tab === 'processing' ? ' active' : '');
  document.getElementById('tab-ready').className = 'tab' + (tab === 'ready' ? ' active' : '');
  render();
}

async function loadData() {
  try {
    const res = await fetch(`${BOT_URL}/pickups?key=${encodeURIComponent(staffKey)}`);
    if (res.status === 401) { sessionStorage.removeItem('wk_staff_key'); location.reload(); return; }
    allPickups = await res.json();
    render();
  } catch (e) { console.error(e); }
}

function itemsSummary(items) {
  if (!Array.isArray(items) || !items.length) return '';
  return items.map(it => `${it.qty}x ${it.name}`).join(', ');
}

function render() {
  const processing = allPickups.filter(p => (p.status === 'picked' || p.status === 'inprogress') && p.needs_delivery === false);
  const ready = allPickups.filter(p => p.status === 'outfordelivery' && p.needs_delivery === false);

  const pc = document.getElementById('count-processing');
  const rc = document.getElementById('count-ready');
  if (processing.length) { pc.style.display = 'inline-flex'; pc.textContent = processing.length; } else pc.style.display = 'none';
  if (ready.length) { rc.style.display = 'inline-flex'; rc.textContent = ready.length; } else rc.style.display = 'none';

  const items = activeTab === 'processing' ? processing : ready;
  const list = document.getElementById('list');
  if (!items.length) { list.innerHTML = `<div class="empty">🎉</div>`; return; }

  list.innerHTML = items.map(p => {
    const summary = itemsSummary(p.items);
    let actionsHtml;
    if (p.flagged) {
      actionsHtml = `<div class="flagged-banner">🚩 WAITING<br>📞 CALLED</div>`;
    } else if (activeTab === 'processing') {
      actionsHtml = `<div class="card-actions">
        <button class="act-btn" onclick="openTally('${p.order_id}')">✅ ${summary ? 'UPDATE TALLY' : 'TALLY NOW'}</button>
        <button class="act-btn act-btn-secondary" onclick="askReportIssue('${p.order_id}')">⚠️ Report Issue</button>
      </div>`;
    } else {
      actionsHtml = `<div class="card-actions">
        <button class="act-btn" onclick="startTakenByCustomer('${p.order_id}', ${p.needs_photo_confirm})">✅ TAKEN BY CUSTOMER</button>
        <button class="act-btn act-btn-secondary" onclick="askUncollected('${p.order_id}')">🕐 Not collected in a while</button>
      </div>`;
    }
    return `<div class="card">
      <div class="card-head">
        <span style="font-size:22px">🧺</span>
        <span class="order-id">${p.order_id}</span>
      </div>
      <div class="card-body">
        <div class="cust-name">${p.name || 'Walk-in'}</div>
        ${summary ? `<div class="items-summary">📦 ${summary}</div>` : `<div class="address-text">Not tallied yet</div>`}
        ${p.notes ? `<div class="notes-text">📝 ${p.notes}</div>` : ''}
        <button class="print-btn-inline" onclick="requestReprint('${p.order_id}')">🖨️ REPRINT TAG</button>
      </div>
      ${actionsHtml}
    </div>`;
  }).join('');
}

async function requestReprint(orderId) {
  try {
    const res = await fetch(`${BOT_URL}/pickups/${orderId}/reprint?key=${encodeURIComponent(staffKey)}`, { method: 'POST' });
    const data = await res.json();
    if (data.success) showToast('🖨️✅');
    else showToast('⚠️');
  } catch (e) { showToast('⚠️'); }
}

function showOverlay(html) {
  document.getElementById('confirm-content').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function closeOverlay() {
  document.getElementById('overlay').classList.remove('show');
}

function renderPickerTabs(tabsElId, gridElId, itemsArray, onChange) {
  const el = document.getElementById(tabsElId);
  if (!el) return;
  el.innerHTML = SVC_LIST.map(s=>`<button class="catalog-tab ${s.key===activeTallyTab?'active':''}" data-svc="${s.key}">${s.icon}</button>`).join('');
  [...el.children].forEach(btn => {
    btn.onclick = () => { activeTallyTab = btn.dataset.svc; renderPickerTabs(tabsElId, gridElId, itemsArray, onChange); renderPickerGrid(gridElId, itemsArray, onChange); };
  });
}
function renderPickerGrid(gridElId, itemsArray, onChange) {
  const el = document.getElementById(gridElId);
  if (!el) return;
  const items = ITEM_CATALOG[activeTallyTab] || [];
  el.innerHTML = items.map(it=>{
    const existing = itemsArray.find(ti=>ti.name===it.name && ti.price===it.price);
    const qty = existing ? existing.qty : 0;
    return `<button class="catalog-item" data-name="${it.name.replace(/"/g,'&quot;')}" data-price="${it.price}">
      <span class="catalog-icon">${it.icon}</span>
      <span class="catalog-name">${it.name}</span>
      ${qty>0?`<span class="tally-qty-badge">${qty}</span>`:''}
    </button>`;
  }).join('');
  [...el.children].forEach(btn => {
    btn.onclick = () => {
      const name = btn.dataset.name, price = Number(btn.dataset.price);
      const existing = itemsArray.find(ti=>ti.name===name && ti.price===price);
      if (existing) {
        const typed = prompt(`Quantity for ${name}:`, existing.qty);
        const n = parseInt(typed);
        if (!isNaN(n) && n >= 0) { if (n === 0) itemsArray.splice(itemsArray.indexOf(existing),1); else existing.qty = n; }
      } else {
        itemsArray.push({ name, qty: 1, price });
      }
      renderPickerGrid(gridElId, itemsArray, onChange);
      onChange();
    };
  });
}

let tallyOrderId = null;
let tallyItems = [];
function openTally(orderId) {
  tallyOrderId = orderId;
  const existingOrder = allPickups.find(p => p.order_id === orderId);
  tallyItems = (existingOrder?.items || []).map(it => ({...it}));
  activeTallyTab = 'dryclean';
  showOverlay(`
    <div class="item-count-note" id="tally-count"></div>
    <div class="catalog-tabs" id="tally-tabs"></div>
    <div class="catalog-grid" id="tally-grid"></div>
    <div class="confirm-actions" style="margin-top:14px">
      <button class="confirm-btn confirm-cancel" onclick="submitTally(false)">💾 SAVE</button>
      <button class="confirm-btn confirm-yes" onclick="submitTally(true)">✅ READY</button>
    </div>
    <button class="confirm-back-link" onclick="closeOverlay()">↩️ CANCEL</button>
  `);
  updateTallyCount();
  renderPickerTabs('tally-tabs', 'tally-grid', tallyItems, updateTallyCount);
  renderPickerGrid('tally-grid', tallyItems, updateTallyCount);
}
function updateTallyCount() {
  const el = document.getElementById('tally-count');
  if (!el) return;
  const total = tallyItems.reduce((s,it)=>s+it.qty,0);
  el.textContent = total ? `${total} item(s) tallied` : 'No items yet';
}
async function submitTally(markReady) {
  if (!tallyItems.length) { showToast('⚠️'); return; }
  closeOverlay();
  try {
    const res = await fetch(`${BOT_URL}/pickups/${tallyOrderId}/tally?key=${encodeURIComponent(staffKey)}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ items: tallyItems, markReady })
    });
    const data = await res.json();
    if (data.success) { showToast(markReady ? '✅' : '💾'); loadData(); }
    else showToast('⚠️');
  } catch(e) { showToast('⚠️'); }
}

let newOrderState = { name:'', phone:'', needsDelivery:false, mode:'itemize', selectedServices:[], items:[] };
function openNewOrder() {
  newOrderState = { name:'', phone:'', needsDelivery:false, mode:'itemize', selectedServices:[], items:[] };
  activeTallyTab = 'dryclean';
  renderNewOrderForm();
}
function renderNewOrderForm() {
  const s = newOrderState;
  const itemCount = s.items.reduce((sum,it)=>sum+it.qty,0);
  showOverlay(`
    <div class="confirm-icon">➕🧺</div>
    <input class="name-input" id="no-name" value="${s.name.replace(/"/g,'&quot;')}" placeholder="Name">
    <input class="phone-input" id="no-phone" type="tel" inputmode="numeric" maxlength="10" value="${s.phone}" placeholder="XXXXXXXXXX">

    <div class="section-label">Pickup Type</div>
    <div class="toggle-row">
      <button class="toggle-btn ${!s.needsDelivery?'active':''}" onclick="setNeedsDelivery(false)">🏠 Counter Pickup</button>
      <button class="toggle-btn ${s.needsDelivery?'active':''}" onclick="setNeedsDelivery(true)">🚚 Needs Delivery</button>
    </div>

    <div class="section-label">Details Now?</div>
    <div class="toggle-row">
      <button class="toggle-btn ${s.mode==='itemize'?'active':''}" onclick="setMode('itemize')">📝 Itemize Now</button>
      <button class="toggle-btn ${s.mode==='quick'?'active':''}" onclick="setMode('quick')">⚡ Quick (later)</button>
    </div>

    <div id="no-mode-content"></div>

    <button class="confirm-btn confirm-yes" style="width:100%;margin-top:14px" onclick="submitNewOrder()">✅ CREATE ${itemCount>0?`(${itemCount} items)`:''}</button>
    <button class="confirm-back-link" onclick="closeOverlay()">↩️ CANCEL</button>
  `);
  document.getElementById('no-name').oninput = (e) => { newOrderState.name = e.target.value; };
  document.getElementById('no-phone').oninput = (e) => { newOrderState.phone = e.target.value; };
  renderNewOrderModeContent();
}
function setNeedsDelivery(val) { newOrderState.needsDelivery = val; renderNewOrderForm(); }
function setMode(val) { newOrderState.mode = val; renderNewOrderForm(); }
function renderNewOrderModeContent() {
  const el = document.getElementById('no-mode-content');
  if (!el) return;
  const s = newOrderState;
  if (s.mode === 'quick') {
    el.innerHTML = `<div class="svc-grid">${SVC_LIST.map(sv=>`<button class="svc-btn ${s.selectedServices.includes(sv.key)?'selected':''}" data-svc="${sv.key}"><span class="svc-emoji">${sv.icon}</span><span class="svc-label">${sv.label}</span></button>`).join('')}</div>`;
    [...el.querySelectorAll('.svc-btn')].forEach(btn => {
      btn.onclick = () => {
        const key = btn.dataset.svc;
        const idx = s.selectedServices.indexOf(key);
        if (idx >= 0) s.selectedServices.splice(idx,1); else s.selectedServices.push(key);
        renderNewOrderForm();
      };
    });
  } else {
    el.innerHTML = `<div class="catalog-tabs" id="no-tabs"></div><div class="catalog-grid" id="no-grid"></div>`;
    renderPickerTabs('no-tabs', 'no-grid', s.items, () => {});
    renderPickerGrid('no-grid', s.items, () => { updateCreateButtonLabel(); });
  }
}
function updateCreateButtonLabel() {
  const itemCount = newOrderState.items.reduce((sum,it)=>sum+it.qty,0);
  const btn = document.querySelector('.confirm-yes');
  if (btn) btn.textContent = `✅ CREATE ${itemCount>0?`(${itemCount} items)`:''}`;
}
async function submitNewOrder() {
  const s = newOrderState;
  if (!s.name.trim()) { showToast('👤❌'); return; }
  if (s.phone.trim().length < 10) { showToast('📱❌'); return; }
  const body = { name: s.name.trim(), phone: s.phone.trim(), needs_delivery: s.needsDelivery };
  if (s.mode === 'itemize') {
    if (!s.items.length) { showToast('⚠️'); return; }
    body.items = s.items.map(it => ({ name: it.name, qty: it.qty, service: findServiceForItem(it.name, it.price) }));
  } else {
    if (!s.selectedServices.length) { showToast('⚠️'); return; }
    body.services = s.selectedServices;
  }
  closeOverlay();
  try {
    const res = await fetch(`${BOT_URL}/pickups/walkin?key=${encodeURIComponent(staffKey)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data.success) { showToast(data.foundExisting ? '👤✅' : '🆕✅'); loadData(); }
    else showToast('⚠️');
  } catch (e) { showToast('⚠️'); }
}
function findServiceForItem(name, price) {
  for (const [svc, items] of Object.entries(ITEM_CATALOG)) {
    if (items.some(it => it.name === name && it.price === price)) return svc;
  }
  return 'laundry';
}

function startTakenByCustomer(orderId, needsPhotoConfirm) {
  takenOrderId = orderId;
  if (!needsPhotoConfirm) {
    showOverlay(`
      <div class="confirm-icon">🧺➡️👤</div>
      <div class="confirm-actions">
        <button class="confirm-btn confirm-cancel" onclick="closeOverlay()">↩️ BACK</button>
        <button class="confirm-btn confirm-yes" onclick="finishTaken(false)">✅ YES</button>
      </div>
    `);
    return;
  }
  showOverlay(`
    <div class="confirm-icon">💰</div>
    <div class="pay-method-grid">
      <button class="pay-method-btn cash" onclick="takenPaidMethod='cash';startTakenPhoto()">💵 CASH</button>
      <button class="pay-method-btn upi" onclick="takenPaidMethod='upi';startTakenPhoto()">📱 UPI</button>
      <button class="pay-method-btn" onclick="takenPaidMethod=null;startTakenPhoto()">❌ NOT PAID</button>
    </div>
    <button class="confirm-back-link" onclick="closeOverlay()">↩️ BACK — didn't mean to tap this</button>
  `);
}
function startTakenPhoto() {
  closeOverlay();
  photoPurpose = 'taken';
  document.getElementById('photo-input').click();
}
function handlePhotoSelected(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  compressImage(file, 1000, 0.65).then((dataUrl) => {
    window._pendingPhotoData = dataUrl;
    if (photoPurpose === 'issue') {
      showOverlay(`
        <img class="photo-preview" src="${dataUrl}">
        <div class="confirm-actions">
          <button class="confirm-btn confirm-cancel" onclick="closeOverlay()">↩️ RETAKE</button>
          <button class="confirm-btn confirm-yes" onclick="submitIssueReport()">✅ SEND</button>
        </div>
      `);
    } else {
      showOverlay(`
        <img class="photo-preview" src="${dataUrl}">
        <div class="confirm-actions">
          <button class="confirm-btn confirm-cancel" onclick="closeOverlay()">↩️ RETAKE</button>
          <button class="confirm-btn confirm-yes" onclick="finishTaken(true)">✅ SEND</button>
        </div>
      `);
    }
  }).catch(() => showToast('⚠️'));
}

// ── DAMAGE / ISSUE REPORTING ──────────────────────────────────────
let photoPurpose = 'taken';
let issueOrderId = null;
let issueReason = null;
function askReportIssue(orderId) {
  issueOrderId = orderId;
  showOverlay(`
    <div class="confirm-icon">⚠️</div>
    <div class="svc-grid">
      <button class="svc-btn" onclick="pickIssueReason('damaged')"><span class="svc-emoji">🩹</span><span class="svc-label">Damaged</span></button>
      <button class="svc-btn" onclick="pickIssueReason('stain')"><span class="svc-emoji">🎨</span><span class="svc-label">Stain</span></button>
      <button class="svc-btn" onclick="pickIssueReason('broken')"><span class="svc-emoji">🔘</span><span class="svc-label">Button/Zip</span></button>
      <button class="svc-btn" onclick="pickIssueReason('other')"><span class="svc-emoji">❓</span><span class="svc-label">Other</span></button>
    </div>
    <button class="confirm-back-link" onclick="closeOverlay()">↩️ CANCEL</button>
  `);
}
function pickIssueReason(reason) {
  issueReason = reason;
  photoPurpose = 'issue';
  closeOverlay();
  document.getElementById('photo-input').click();
}
async function submitIssueReport() {
  const orderId = issueOrderId, reason = issueReason, photoBase64 = window._pendingPhotoData;
  closeOverlay();
  try {
    const res = await fetch(`${BOT_URL}/pickups/${orderId}/report-issue?key=${encodeURIComponent(staffKey)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason, photoBase64 })
    });
    const data = await res.json();
    if (data.success) { showToast('⚠️✅'); loadData(); }
    else showToast('⚠️');
  } catch (e) { showToast('⚠️'); }
  issueOrderId = null; issueReason = null; window._pendingPhotoData = null;
}

function compressImage(file, maxDimension, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDimension) { height *= maxDimension / width; width = maxDimension; }
        else if (height > maxDimension) { width *= maxDimension / height; height = maxDimension; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function finishTaken(withPhoto) {
  const orderId = takenOrderId;
  const photoBase64 = withPhoto ? window._pendingPhotoData : null;
  const paidMethod = takenPaidMethod;
  closeOverlay();
  try {
    const res = await fetch(`${BOT_URL}/pickups/${orderId}/taken-by-customer?key=${encodeURIComponent(staffKey)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ photoBase64, paidMethod })
    });
    const data = await res.json();
    if (data.success) { showToast('✅'); loadData(); }
    else showToast('⚠️');
  } catch (e) { showToast('⚠️'); }
  takenOrderId = null; takenPaidMethod = null; window._pendingPhotoData = null;
}

  showOverlay(`
    <div class="confirm-icon">🕐📞</div>
    <div class="confirm-actions">
      <button class="confirm-btn confirm-cancel" onclick="closeOverlay()">↩️ BACK</button>
      <button class="confirm-btn confirm-yes" style="background:#d97706" onclick="doUncollected('${orderId}')">✅ YES</button>
    </div>
  `);
}
async function doUncollected(orderId) {
  closeOverlay();
  try {
    const res = await fetch(`${BOT_URL}/pickups/${orderId}/uncollected?key=${encodeURIComponent(staffKey)}`, { method: 'POST' });
    const data = await res.json();
    if (data.success) { showToast('📞✅'); loadData(); }
    else showToast('⚠️');
  } catch (e) { showToast('⚠️'); }
}

if (staffKey) {
  fetch(`${BOT_URL}/pickups?key=${encodeURIComponent(staffKey)}`).then(res => {
    if (res.status === 401) { sessionStorage.removeItem('wk_staff_key'); document.getElementById('login-screen').style.display = 'flex'; }

}
