<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Washkart — Chats & Leads</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --green:#12a4da;--green-light:#f0f9ff;--green-mid:#bae6fd;--green-dark:#0c4a6e;
  --blue:#2563eb;--orange:#ea580c;--red:#dc2626;--purple:#7c3aed;
  --text:#111827;--muted:#6b7280;--border:#e5e7eb;--bg:#f9fafb;--white:#fff;
  --shadow:0 1px 3px rgba(0,0,0,.1);--shadow-md:0 4px 6px rgba(0,0,0,.07);
}
body{font-family:"Inter",sans-serif;background:var(--bg);color:var(--text);font-size:14px;}

/* TOP BAR */
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 1rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar-left{display:flex;align-items:center;gap:12px;}
.brand{font-weight:700;font-size:15px;color:var(--green-dark);display:flex;align-items:center;gap:6px;}
.brand-badge{font-size:10px;background:var(--green-mid);color:#0c4a6e;padding:1px 6px;border-radius:10px;font-weight:600;}
.tab-switch{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px;}
.tab-btn{padding:6px 16px;border-radius:8px;font-size:13px;font-weight:600;border:none;background:transparent;color:var(--muted);cursor:pointer;font-family:"Inter",sans-serif;display:flex;align-items:center;gap:6px;}
.tab-btn.active{background:var(--white);color:var(--green-dark);box-shadow:var(--shadow);}
.tab-badge{background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700;}
.clock{font-size:12px;color:var(--muted);font-family:"JetBrains Mono",monospace;}

/* CONTENT */
.content{height:calc(100vh - 56px);overflow:hidden;}
.view{display:none;height:100%;}
.view.active{display:flex;}

/* CHAT VIEW */
.chat-list{width:300px;flex-shrink:0;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;}
.chat-list-search{padding:.6rem;border-bottom:1px solid var(--border);}
.search-input{width:100%;border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;font-family:"Inter",sans-serif;background:var(--bg);}
.search-input:focus{outline:none;border-color:var(--green);background:var(--white);}
.chat-list-items{overflow-y:auto;flex:1;}
.chat-item{padding:.7rem .9rem;border-bottom:1px solid #f3f4f6;cursor:pointer;transition:background .1s;}
.chat-item:hover{background:var(--bg);}
.chat-item.active{background:var(--green-light);border-left:3px solid var(--green);}
.chat-item-name{font-weight:500;font-size:13px;margin-bottom:2px;}
.chat-item-preview{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-item-time{font-size:10px;color:var(--muted);}
.chat-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--white);}
.chat-panel-header{padding:.8rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.chat-messages{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.5rem;background:#f0f0f0;}
.msg-bubble{max-width:70%;padding:.6rem .9rem;border-radius:12px;font-size:13px;line-height:1.5;word-break:break-word;}
.msg-customer{background:var(--white);border-radius:0 12px 12px 12px;align-self:flex-start;box-shadow:var(--shadow);}
.msg-bot{background:#e0f2fe;border-radius:12px 0 12px 12px;align-self:flex-end;}
.chat-session-info{padding:.5rem 1rem;font-size:11px;color:var(--muted);border-top:1px solid var(--border);background:var(--bg);}
.chat-reply{padding:.8rem;border-top:1px solid var(--border);display:flex;gap:.5rem;}
.chat-reply-input{flex:1;border:1px solid var(--border);border-radius:8px;padding:.5rem .8rem;font-size:13px;font-family:"Inter",sans-serif;resize:none;max-height:100px;}
.chat-reply-input:focus{outline:none;border-color:var(--green);}
.btn{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:"Inter",sans-serif;transition:all .15s;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:#0d7ba8;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-outline:hover{background:var(--bg);}
.empty{padding:2.5rem;text-align:center;color:var(--muted);}
.empty-icon{font-size:32px;margin-bottom:8px;}

/* LEADS VIEW */
.leads-view{flex:1;overflow-y:auto;padding:1rem;}
.funnel{display:flex;gap:.5rem;margin-bottom:1rem;max-width:900px;}
.funnel-stage{flex:1;text-align:center;padding:.8rem;border-radius:10px;cursor:pointer;border:2px solid transparent;}
.funnel-stage.selected{border-color:currentColor;}
.funnel-count{font-size:22px;font-weight:700;}
.funnel-label{font-size:11px;font-weight:500;margin-top:2px;text-transform:capitalize;}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.b-enquired{background:#eff6ff;color:#1d4ed8;}
.b-booking_started{background:#fef3c7;color:#92400e;}
.b-dropped{background:#fee2e2;color:#991b1b;}
.b-converted{background:#e0f2fe;color:#0c4a6e;}
.lead-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:.8rem 1rem;margin-bottom:.6rem;max-width:900px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:var(--shadow);}
.lead-phone{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:500;}
.lead-msg{font-size:12px;color:var(--muted);margin-top:2px;max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lead-time{font-size:11px;color:var(--muted);}

@media(max-width:768px){
  .chat-list{position:fixed;inset:56px 0 0 0;z-index:40;width:100%;}
  .chat-list.hide-mobile{display:none;}
  .chat-panel{position:fixed;inset:56px 0 0 0;z-index:40;}
  .chat-panel.hide-mobile{display:none;}
  .back-btn{display:inline-block !important;}
  .funnel{flex-wrap:wrap;}
  .funnel-stage{min-width:45%;}
}
.back-btn{display:none;background:none;border:none;font-size:18px;cursor:pointer;margin-right:6px;color:var(--green-dark);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="brand">🧺 Washkart <span class="brand-badge">Chats & Leads</span></div>
  </div>
  <div class="tab-switch">
    <button class="tab-btn active" id="tab-chats" onclick="switchView('chats')">💬 Chats</button>
    <button class="tab-btn" id="tab-leads" onclick="switchView('leads')">🎯 Leads <span class="tab-badge" id="leads-badge" style="display:none">0</span></button>
  </div>
  <div class="clock" id="clock"></div>
</div>

<div class="content">
  <!-- CHATS -->
  <div class="view active" id="view-chats">
    <div class="chat-list" id="chat-list-panel">
      <div class="chat-list-search"><input class="search-input" id="chat-search" placeholder="Search by phone..." oninput="renderChatList()"></div>
      <div class="chat-list-items" id="chat-list-items"><div class="empty">Loading...</div></div>
    </div>
    <div class="chat-panel hide-mobile" id="chat-panel-el">
      <div class="chat-panel-header">
        <div style="display:flex;align-items:center">
          <button class="back-btn" onclick="showListMobile()">←</button>
          <div>
            <div style="font-weight:600" id="chat-title">Select a conversation</div>
            <div style="font-size:11px;color:var(--muted)" id="chat-subtitle"></div>
          </div>
        </div>
        <div style="display:flex;gap:6px" id="chat-actions" style="display:none">
          <button class="btn btn-outline" id="btn-takeover" onclick="toggleTakeover()">Take Over</button>
        </div>
      </div>
      <div class="chat-messages" id="chat-messages"><div class="empty" style="margin:auto"><div class="empty-icon">💬</div>Select a chat</div></div>
      <div class="chat-session-info" id="chat-session-info"></div>
      <div class="chat-reply">
        <textarea class="chat-reply-input" id="chat-reply-text" placeholder="Type a message... (Shift+Enter for new line)" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatReply();}"></textarea>
        <button class="btn btn-primary" onclick="sendChatReply()">Send</button>
      </div>
    </div>
  </div>

  <!-- LEADS -->
  <div class="view" id="view-leads">
    <div class="leads-view">
      <div class="funnel" id="leads-funnel"></div>
      <div id="leads-list"></div>
    </div>
  </div>
</div>

<script>
const BOT_URL = 'https://washkart-bot.onrender.com';
const DASHBOARD_PASSWORD = 'washkart2025';
const LEAD_STAGE_LABELS = {enquired:'Enquired',booking_started:'Booking Started',dropped:'Dropped',converted:'Converted'};

// AUTH — same password as dashboard
function checkAuth() {
  if (sessionStorage.getItem('wk_auth') === DASHBOARD_PASSWORD) return true;
  const pwd = prompt('Washkart Admin Password:');
  if (pwd === DASHBOARD_PASSWORD) { sessionStorage.setItem('wk_auth', pwd); return true; }
  document.body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;gap:16px"><div style="font-size:18px;color:#dc2626">Wrong password.</div><button onclick="location.reload()" style="padding:10px 24px;background:#12a4da;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">Try Again</button></div>';
  return false;
}
if (!checkAuth()) { throw new Error('auth failed'); }

// STATE
let allConversations = [], allCustomers = [], allLeads = [];
let selectedChat = null, takeoverActive = false, leadFilter = 'all';

function updateClock() { document.getElementById('clock').textContent = new Date().toLocaleString('en-IN',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
setInterval(updateClock,1000); updateClock();

function switchView(v) {
  document.getElementById('view-chats').classList.toggle('active', v==='chats');
  document.getElementById('view-leads').classList.toggle('active', v==='leads');
  document.getElementById('tab-chats').classList.toggle('active', v==='chats');
  document.getElementById('tab-leads').classList.toggle('active', v==='leads');
}

// Mobile: chat list vs panel toggle
function showChatMobile() {
  document.getElementById('chat-list-panel').classList.add('hide-mobile');
  document.getElementById('chat-panel-el').classList.remove('hide-mobile');
}
function showListMobile() {
  document.getElementById('chat-list-panel').classList.remove('hide-mobile');
  document.getElementById('chat-panel-el').classList.add('hide-mobile');
}

// ── LOAD DATA ──────────────────────────────────────────────
async function loadAll() {
  try {
    const [convRes, custRes, leadRes] = await Promise.all([
      fetch(`${BOT_URL}/conversations?_t=${Date.now()}`, {cache:'no-store'}),
      fetch(`${BOT_URL}/customers?_t=${Date.now()}`, {cache:'no-store'}).catch(()=>null),
      fetch(`${BOT_URL}/leads?_t=${Date.now()}`, {cache:'no-store'}).catch(()=>null),
    ]);
    allConversations = await convRes.json().catch(()=>[]);
    allCustomers = custRes ? await custRes.json().catch(()=>[]) : [];
    allLeads = leadRes ? await leadRes.json().catch(()=>[]) : [];
    renderChatList();
    renderLeads();
    if (selectedChat) refreshSelectedChat();
  } catch(e) { console.error('loadAll error:', e); }
}

// ── CHATS ──────────────────────────────────────────────────
function filterChats() { renderChatList(); }
function renderChatList() {
  const q = (document.getElementById('chat-search')?.value||'').toLowerCase();
  let convs = allConversations;
  if(q) convs = convs.filter(c=>c.phone?.includes(q));
  const el = document.getElementById('chat-list-items');
  if(!convs.length){ el.innerHTML='<div class="empty">No conversations</div>'; return; }
  el.innerHTML = convs.map(c=>{
    const cust = allCustomers.find(x=>x.phone===c.phone);
    const lastMsg = (c.history||[]).slice(-1)[0];
    return `<div class="chat-item ${c.phone===selectedChat?'active':''}" onclick="selectChat('${c.phone}')">
      <div style="display:flex;justify-content:space-between">
        <div class="chat-item-name">${cust?.name||'+'+c.phone}</div>
        <div class="chat-item-time">${c.updated_at?new Date(c.updated_at).toLocaleString('en-IN',{hour:'2-digit',minute:'2-digit'}):''}</div>
      </div>
      <div class="chat-item-preview">${lastMsg?`${lastMsg.role==='customer'?'👤':'🤖'} ${lastMsg.text}`:''}</div>
      ${c.step&&c.step!=='idle'?`<div style="font-size:10px;color:var(--green);margin-top:2px">Step: ${c.step}</div>`:''}
    </div>`;
  }).join('');
}
function selectChat(phone) {
  selectedChat = phone;
  renderChatList();
  const c = allConversations.find(x=>x.phone===phone);
  const cust = allCustomers.find(x=>x.phone===phone);
  document.getElementById('chat-title').textContent = cust?.name || '+'+phone;
  document.getElementById('chat-subtitle').textContent = `+${phone} | ${c?.step||'idle'}`;
  document.getElementById('chat-actions').style.display = 'flex';
  takeoverActive = c?.takeoverActive||false;
  const btn = document.getElementById('btn-takeover');
  btn.textContent = takeoverActive?'Resume Bot':'Take Over';
  btn.style.background = takeoverActive?'var(--red)':'';
  btn.style.color = takeoverActive?'#fff':'';
  const msgs = c?.history||[];
  const msgEl = document.getElementById('chat-messages');
  if(!msgs.length){ msgEl.innerHTML='<div class="empty" style="margin:auto">No message history</div>'; }
  else {
    msgEl.innerHTML = msgs.map(m=>`<div style="display:flex;justify-content:${m.role==='customer'?'flex-start':'flex-end'}">
      <div class="msg-bubble ${m.role==='customer'?'msg-customer':'msg-bot'}">${m.text.replace(/\n/g,'<br>')}</div>
    </div>`).join('');
    msgEl.scrollTop = msgEl.scrollHeight;
  }
  const bk = c?.booking||{};
  document.getElementById('chat-session-info').textContent = `Step: ${c?.step||'idle'} | Name: ${bk.name||'-'} | Date: ${bk.date||'-'} | Slot: ${bk.slot||'-'}`;
  if (window.innerWidth <= 768) showChatMobile();
}
function refreshSelectedChat() {
  const updated = allConversations.find(c=>c.phone===selectedChat);
  if(!updated) return;
  const msgs = updated.history||[];
  const msgEl = document.getElementById('chat-messages');
  const atBottom = msgEl.scrollHeight - msgEl.scrollTop - msgEl.clientHeight < 50;
  msgEl.innerHTML = msgs.length ? msgs.map(m=>`<div style="display:flex;justify-content:${m.role==='customer'?'flex-start':'flex-end'}"><div class="msg-bubble ${m.role==='customer'?'msg-customer':'msg-bot'}">${m.text.replace(/\n/g,'<br>')}</div></div>`).join('') : '<div class="empty" style="margin:auto">No messages</div>';
  if(atBottom) msgEl.scrollTop = msgEl.scrollHeight;
  const bk = updated.booking||{};
  document.getElementById('chat-session-info').textContent = `Step: ${updated.step||'idle'} | Name: ${bk.name||'-'} | Date: ${bk.date||'-'} | Slot: ${bk.slot||'-'}`;
}
async function toggleTakeover() {
  if(!selectedChat) return;
  takeoverActive = !takeoverActive;
  await fetch(`${BOT_URL}/takeover`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:selectedChat,active:takeoverActive})});
  const btn = document.getElementById('btn-takeover');
  btn.textContent = takeoverActive?'Resume Bot':'Take Over';
  btn.style.background = takeoverActive?'var(--red)':'';
  btn.style.color = takeoverActive?'#fff':'';
}
async function sendChatReply() {
  if(!selectedChat) return;
  const text = document.getElementById('chat-reply-text').value.trim();
  if(!text) return;
  const cust = allCustomers.find(c=>c.phone===selectedChat);
  const branch = cust?.branch || 'bavdhan';
  const replyBtn = document.querySelector('.chat-reply .btn-primary');
  if(replyBtn){ replyBtn.textContent='...'; replyBtn.disabled=true; }
  try {
    const res = await fetch(`${BOT_URL}/send-message`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({phone:selectedChat, message:text, branch})
    });
    const data = await res.json();
    if(data.success){
      document.getElementById('chat-reply-text').value='';
      const msgEl = document.getElementById('chat-messages');
      const bubble = document.createElement('div');
      bubble.style.cssText='display:flex;justify-content:flex-end';
      bubble.innerHTML = `<div class="msg-bubble msg-bot" style="background:#e0f2fe">${text.replace(/\n/g,'<br>')}</div>`;
      msgEl.appendChild(bubble);
      msgEl.scrollTop = msgEl.scrollHeight;
      setTimeout(loadAll, 2000);
    } else { alert(data.error||'Send failed'); }
  } catch(e) { alert('Network error'); }
  finally { if(replyBtn){ replyBtn.textContent='Send'; replyBtn.disabled=false; } }
}

// ── LEADS ──────────────────────────────────────────────────
function renderLeads() {
  const stages = ['enquired','booking_started','dropped','converted'];
  const colors = {enquired:'#1d4ed8',booking_started:'#92400e',dropped:'#991b1b',converted:'#0c4a6e'};
  const bgs = {enquired:'#eff6ff',booking_started:'#fef3c7',dropped:'#fef2f2',converted:'#f0f9ff'};
  document.getElementById('leads-funnel').innerHTML =
    [{key:'all',label:'All',count:allLeads.length,bg:'#f3f4f6',color:'#374151'},...stages.map(s=>({key:s,label:s.replace('_',' '),count:allLeads.filter(l=>l.stage===s).length,bg:bgs[s],color:colors[s]}))]
    .map(s=>`<div class="funnel-stage ${leadFilter===s.key?'selected':''}" style="background:${s.bg};color:${s.color}" onclick="leadFilter='${s.key}';renderLeads()">
      <div class="funnel-count">${s.count}</div>
      <div class="funnel-label">${s.label}</div>
    </div>`).join('');

  const newLeads = allLeads.filter(l=>l.stage==='enquired'||l.stage==='dropped');
  const badge = document.getElementById('leads-badge');
  if(newLeads.length){ badge.style.display=''; badge.textContent=newLeads.length; } else { badge.style.display='none'; }

  const filtered = leadFilter==='all' ? allLeads : allLeads.filter(l=>l.stage===leadFilter);
  const el = document.getElementById('leads-list');
  if(!filtered.length){ el.innerHTML='<div class="empty"><div class="empty-icon">🎯</div>No leads</div>'; return; }
  el.innerHTML = filtered.map(l=>`<div class="lead-card">
    <div style="min-width:0">
      <div class="lead-phone">+${l.phone}</div>
      <div class="lead-msg">${l.last_message||'-'}</div>
    </div>
    <div style="text-align:right;flex-shrink:0">
      <span class="badge b-${l.stage}">${LEAD_STAGE_LABELS[l.stage]||l.stage}</span>
      <div class="lead-time">${l.updated_at?new Date(l.updated_at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'-'}</div>
    </div>
    <button class="btn btn-outline" onclick="jumpToChat('${l.phone}')">💬 Chat</button>
  </div>`).join('');
}
function jumpToChat(phone) {
  switchView('chats');
  selectChat(phone);
}

// ── INIT ──────────────────────────────────────────────────
loadAll();
setInterval(loadAll, 20000);
window.addEventListener('resize', () => { if (window.innerWidth > 768) { document.getElementById('chat-list-panel').classList.remove('hide-mobile'); document.getElementById('chat-panel-el').classList.remove('hide-mobile'); } });
</script>
</body>
</html>
